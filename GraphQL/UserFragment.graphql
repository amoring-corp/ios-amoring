fragment UserInfo on User {
  id
  email
  status
  role
  profile {
    ... ProfileInfo
  }
  business {
    ... BusinessInfo
  }
  createdAt
  updatedAt
  
  usedLikesCount
  maxLikes
  likesCredit
                    
  loungePassExpiredAt
  invisiblePassExpiredAt
  visibleReactionsPassExpiredAt
  isPhoneNumberVerified
}
