subscription MessageSent {
  messageSent {
      ... MessageInfo
  }
}

subscription ReactionAdded {
  reactionAdded {
    ... ReactionInfo
  }
}

subscription ConversationDeleted {
  conversationDeleted {
    id
    deletedBy {
      profile {
        ... ProfileInfo
      }
    }
  }
}

subscription NewCheckin {
  checkIn {
    id
    ... CheckInInfo
  }
}
