mutation signUp($email: String!, $password: String!) {
  signUp(data: { email: $email, password: $password, role: business}) {
    confirmationNumber
    emailConfirmationToken
    user {
      ... UserInfo
    }
  }
}

mutation signUpUser($email: String!, $password: String!) {
  signUp(data: { email: $email, password: $password, role: user}) {
    confirmationNumber
    emailConfirmationToken
    user {
      ... UserInfo
    }
  }
}
