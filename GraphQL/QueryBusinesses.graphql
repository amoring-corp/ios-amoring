query QueryBusinesses($near: NearLocationInput, $districts: [String!], $sort: BusinessSortBy, $nearByOnly: Boolean!, $take: Int, $skip: Int) {
  businesses(near: $near, districts: $districts, sort: $sort, nearByOnly: $nearByOnly, take: $take, skip: $skip) {
    items {
      ... BusinessInfo
    }
    total
  }
}
