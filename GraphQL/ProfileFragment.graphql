fragment ProfileInfo on Profile {
  id
  userId
  name
  age
  avatarUrl
  birthYear
  height
  weight
  mbti
  education
  occupation
  bio
  gender
  activeCheckIn {
    ... CheckInInfo
  }
  images {
    ... ImageFragment
  }
  interests {
    id
    name
    category {
      id
      createdAt
      interests {
        id
        name
      }
      name
      updatedAt
    }
    categoryId
    createdAt
    updatedAt
  }
  createdAt
  updatedAt
  usedLikesCount
  maxLikes
  isBlurred
  isInPrivateMode
}
